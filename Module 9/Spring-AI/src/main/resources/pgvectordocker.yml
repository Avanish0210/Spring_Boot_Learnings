services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: pgvector-local
    environment:
      POSTGRES_USER: my-user
      POSTGRES_PASSWORD: postgres-sql
      POSTGRES_DB: my-test-vector-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: